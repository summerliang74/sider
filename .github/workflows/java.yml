name: Java migration
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
jobs:
  verify-java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_DB: sider_java_test
          POSTGRES_USER: sider_test
          POSTGRES_PASSWORD: sider_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sider_test:sider_test@127.0.0.1:5432/sider_java_test?sslmode=disable
      TEST_DATABASE_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Initialize isolated schema from unchanged migrations
        run: |
          for migration in drizzle/[0-9]*.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: mvn -B -ntp -f backend/pom.xml verify
      - run: node --test scripts/vanilla-*.test.mjs
