services:
  app:
    image: shsid-online:latest
    build:
      context: .
      args:
        NEXT_PUBLIC_BOT_SITE_KEY: ${NEXT_PUBLIC_BOT_SITE_KEY}
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  upload-worker:
    image: shsid-online:latest
    env_file:
      - .env.production
    environment:
      UPLOAD_WORKER_BASE_URL: http://app:3000
    command: ["node", "scripts/upload-worker.mjs"]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
