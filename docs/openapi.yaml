          type: object
          additionalProperties: false
          required: [ title, description ]
          properties:
            title:
              type: array
              items: { $ref: '#/components/schemas/HighlightSegment' }
            description:
              type: array
              items: { $ref: '#/components/schemas/HighlightSegment' }
    ResourceDetail:
      type: object
      additionalProperties: false
      required:
        [
          id,
          title,
          description,
          tags,
          originalFilename,
          mimeType,
          sizeBytes,
          status,
          publishedAt,
          authorName,
          authorId
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        tags: { $ref: '#/components/schemas/Tags' }
        originalFilename: { type: string, maxLength: 255 }
        mimeType: { $ref: '#/components/schemas/MimeType' }
        sizeBytes: { $ref: '#/components/schemas/SizeBytes' }
        status:
          {
            type: string,
            enum: [ pending, scanning, active, hidden, quarantined, failed ]
          }
