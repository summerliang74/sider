        originalFilename: { type: string, maxLength: 255 }
        status: { $ref: '#/components/schemas/ResourceStatus' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    OwnResourcePage:
      type: object
      additionalProperties: false
