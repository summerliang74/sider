map $uri $sider_page_limit_key {
    default "";
    ~^/(?:login(?:/|$)|auth/discovery(?:/|$)|resources(?:/|$)|me(?:/|$)|admin(?:/|$)) $binary_remote_addr;
}

limit_req_zone $sider_page_limit_key zone=sider_page_limit:10m rate=10r/s;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name siderlearn.com www.siderlearn.com;

    ssl_certificate /etc/letsencrypt/live/siderlearn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siderlearn.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 55m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = /internal/malware-scan {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8081/scan;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_buffering off;
    }

    location / {
        limit_req zone=sider_page_limit burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name siderlearn.com www.siderlearn.com;
    return 301 https://$host$request_uri;
}
