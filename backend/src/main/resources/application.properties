spring.application.name=sider
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:${PORT:8080}}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=200
server.tomcat.accept-count=40
spring.task.scheduling.pool.size=2
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=25s
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.postgresql=OFF
logging.level.org.springframework.jdbc=INFO
logging.level.software.amazon.awssdk=WARN
